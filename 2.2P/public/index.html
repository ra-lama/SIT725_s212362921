<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Task 2.2P</title>
    </head>
    <body>
        <h1>Calculate the sum of 2 numbers</h1>

        <div>
            <label for="num1">First value:</label>
            <input type="text" id="num1" name="num1">
            &nbsp; &nbsp;
            <label for="num2">Second value:</label>
            <input type="text" id="num2" name="num2">
            <button id="getTotal">Calculate SUM</button>
        </div>

        <p>&nbsp;</p>

        <div>
            <p id="showTotal"></p>
        </div>

        <script>
            document.getElementById('getTotal').addEventListener('click', function() {
                // console.log("Clicked button"); // ensuring the button click event worked

                let n1 = document.getElementById("num1").value;
                let n2 = document.getElementById("num2").value;
                let urlToGet = `/api/addition/${n1}/${n2}`;
                // console.log("Url: ", urlToGet); // checking URL

                if(n1.trim() === "" || n2.trim() === "") {
                    document.getElementById('showTotal').innerText = "Both boxes must be filled with a value.";
                }
                else {
                    fetch(urlToGet)
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById('showTotal').innerText = data;
                    })
                    .catch(error => {
                        console.error('Error fetching sum.', error);
                        document.getElementById('showTotal').innerText = "Error occurred fetching sum.";
                    });
                }
            })
        </script>
    </body>
</html>
